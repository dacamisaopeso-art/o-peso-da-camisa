name: Conferir atualização oficial Android
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Versão pública a conferir
        required: true
        default: android-v0.6.0
permissions:
  contents: read
jobs:
  atualizar:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sudo setfacl -m u:$(id -un):rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          OPC_RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          OPC_PREVIOUS_VERSION: '0.5.0'
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel on
          script: |
            sdkmanager 'build-tools;35.0.0'
            python _projetos/opc-android/tests/upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OPC-atualizacao-oficial
          path: |
            upgrade-proof/result.json
            upgrade-proof/upgrade.png
            upgrade-proof/last-ui.xml
          if-no-files-found: ignore
