name: Publicar posts do blog
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/gerar_blog.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install markdown pyyaml
      - run: python scripts/gerar_blog.py
      - name: Salvar páginas geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html publicacoes/
          git diff --cached --quiet || (git commit -m "Publica novos artigos do blog" && git push)
