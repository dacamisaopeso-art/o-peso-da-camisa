name: Publicar posts do blog
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/gerar_blog.py'
      - 'scripts/blog_security.py'
      - 'scripts/site_policies.py'
      - 'scripts/requirements-blog.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-blog.txt
      - run: python scripts/gerar_blog.py
      - name: Salvar páginas geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html publicacoes/ sitemap.xml
          git diff --cached --quiet || (git commit -m "Publica novos artigos do blog" && git push)
